name: Build & Deploy

# Deploy the exact successful CI artifact, never rebuild in a privileged workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]

permissions:
  contents: read
  actions: read

concurrency:
  group: qds-production-site
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reject superseded production build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/production" --jq .object.sha)" = "$RELEASE_SHA"

      - name: Download exact CI run artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: site-${{ github.event.workflow_run.head_sha }}
          path: site

      - name: Send verified site to restricted receiver
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_SSH_PRIVATE_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          umask 077
          SSH_DIR="$(mktemp -d "$RUNNER_TEMP/qds-ssh.XXXXXX")"
          trap 'rm -rf -- "$SSH_DIR"' EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          unset DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS
          tar -C site -czf "$SSH_DIR/site.tar.gz" .
          # Check again immediately before sending bytes (not just before download).
          test "$(gh api "repos/$GH_REPO/git/ref/heads/production" --jq .object.sha)" = "$RELEASE_SHA"
          ssh -F /dev/null -T -i "$SSH_DIR/key" -p "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" -o ConnectTimeout=20 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "deploy $RELEASE_SHA $SOURCE_RUN_ID" < "$SSH_DIR/site.tar.gz"

      - name: Verify public HTTPS release and static routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import urljoin, urlsplit

          base = 'https://qds.osmova.com'
          def get(path):
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  if urlsplit(response.url).scheme != 'https' or urlsplit(response.url).netloc != 'qds.osmova.com':
                      raise RuntimeError('Unexpected health-check redirect')
                  return response.read()

          def verified_file(path):
              data = get(path)
              local = (Path('site') / urlsplit(path).path.lstrip('/')).resolve()
              assert local.is_relative_to(Path('site').resolve()), path
              assert hashlib.sha256(data).digest() == hashlib.sha256(local.read_bytes()).digest(), path
              return data

          release = json.loads(get('/release.json?sha=' + os.environ['RELEASE_SHA']))
          assert release == {'sha': os.environ['RELEASE_SHA'], 'run_id': os.environ['SOURCE_RUN_ID'],
                             'repository': os.environ['GH_REPO']}, release
          for path in ('/index.html', '/histoire/index.html', '/conformance.html', '/conformance-layered.html'):
              html = verified_file(path).decode('utf-8')
              assert '<html' in html.lower(), path
              assets = re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|css)(?:\?[^"\']*)?)["\']', html)
              assert assets, 'No static assets in ' + path
              for asset in assets:
                  url = urlsplit(urljoin(base + path, asset))
                  assert url.scheme == 'https' and url.netloc == 'qds.osmova.com', asset
                  verified_file(url.path + ('?' + url.query if url.query else ''))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          try:
              urllib.request.build_opener(NoRedirect).open(base + '/histoire', timeout=30)
              raise RuntimeError('/histoire must redirect')
          except urllib.error.HTTPError as error:
              assert error.code in (301, 302, 307, 308), error.code
              assert urljoin(base + '/histoire', error.headers['Location']) == base + '/histoire/'
          for prefix in ('/assets/', '/histoire/assets/'):
              try:
                  get(prefix + 'qds-missing-' + os.environ['RELEASE_SHA'] + '.js')
                  raise RuntimeError('Missing asset returned success')
              except urllib.error.HTTPError as error:
                  assert error.code == 404, error.code
          PY
          # No automatic rollback: the operator retains previous releases for recovery.
